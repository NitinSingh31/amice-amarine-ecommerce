version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: amice-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=amice_amarine

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amice-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/amice_amarine
      - JWT_SECRET=amice_amarine_jwt_secret_production_2026
      - JWT_EXPIRES_IN=7d
      - COOKIE_SECRET=amice_cookie_secret_2026
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:5000
      - RAZORPAY_KEY_ID=rzp_live_placeholder_key
      - RAZORPAY_KEY_SECRET=rzp_secret_placeholder_key
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amice-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    depends_on:
      - backend

volumes:
  mongo-data:
